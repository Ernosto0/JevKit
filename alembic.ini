; Alembic configuration for JevKit's PostgreSQL persistence (PLAN.md section 15).
;
; The database URL is NOT set here -- migrations/env.py reads it from
; JEVKIT_DATABASE_URL / .env via apps.api.config.get_api_settings(), the same
; place the running API reads it from, so migrations and the app never drift.
;
;   alembic upgrade head
;   alembic revision -m "add a column" --autogenerate

[alembic]
script_location = migrations
prepend_sys_path = .

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
