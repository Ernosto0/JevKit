# Local development stack: Postgres, the API, and the dashboard.
#
#   docker compose up db          # database only; run the API on the host
#   docker compose up             # everything
#
# The SDK alone needs none of this (PLAN.md section 7).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jevkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jevkit}
      POSTGRES_DB: ${POSTGRES_DB:-jevkit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jevkit} -d ${POSTGRES_DB:-jevkit}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: [.env]
    environment:
      JEVKIT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jevkit}:${POSTGRES_PASSWORD:-jevkit}@db:5432/${POSTGRES_DB:-jevkit}
      JEVKIT_API_PERSISTENCE: postgres
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./packages
          target: /app/packages
        - action: sync
          path: ./apps/api
          target: /app/apps/api

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on: [api]

volumes:
  pgdata:
