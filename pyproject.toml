[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "jevkit"
dynamic = ["version"]
description = "An open-source, Jev-first decision layer for AI applications."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Cinar Aksoy" }]
keywords = ["jev", "llm", "decisions", "classification", "routing", "evaluation", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

# Keep the SDK dependency surface minimal: the core library must be usable
# without FastAPI, PostgreSQL or the dashboard (see PLAN.md section 7).
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
]

[project.optional-dependencies]
cli = [
  "typer>=0.12,<1.0",
  "rich>=13.7",
]
api = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
]
benchmarks = [
  "numpy>=1.26",
  "pyyaml>=6.0",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "aiosqlite>=0.20",   # exercises PostgresStore against ephemeral SQLite, no live Postgres needed
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]
all = ["jevkit[cli,api,benchmarks]"]

[project.scripts]
jevkit = "jevkit.cli:main"

[project.urls]
Homepage = "https://github.com/cinaraksoy/jevkit"
Repository = "https://github.com/cinaraksoy/jevkit"
Issues = "https://github.com/cinaraksoy/jevkit/issues"
Changelog = "https://github.com/cinaraksoy/jevkit/blob/main/CHANGELOG.md"

# ---------------------------------------------------------------------------
# Build: the installable package lives at packages/jevkit and maps to `jevkit`.
# ---------------------------------------------------------------------------
[tool.hatch.version]
path = "packages/jevkit/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["packages/jevkit"]

[tool.hatch.build.targets.sdist]
include = ["packages/jevkit", "README.md", "LICENSE", "CHANGELOG.md"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: talks to a real external service; requires credentials",
  "benchmark: runs a dataset through one or more providers; slow and billable",
]

[tool.coverage.run]
source = ["packages/jevkit"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"examples/**" = ["T201"]
# Typer's documented idiom is a call in the argument default.
"packages/jevkit/cli.py" = ["B008"]
# The policy exceptions read as outcomes, not as "-Error" suffixed failures:
# RetryLimitExceeded, FallbackExhausted, ReviewRequired.
"packages/jevkit/errors.py" = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "jevkit"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "packages"
files = ["packages/jevkit", "apps/api"]

[[tool.mypy.overrides]]
module = ["tests.*", "examples.*"]
strict = false
